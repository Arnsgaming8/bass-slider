<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bass Slider</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      color: #666;
      margin-bottom: 3rem;
      font-size: 0.9rem;
    }
    .frequency-display {
      font-size: 5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
      font-variant-numeric: tabular-nums;
    }
    .frequency-unit {
      font-size: 1.2rem;
      color: #888;
      font-weight: 400;
    }
    .note-label {
      font-size: 1.2rem;
      color: #f59e0b;
      margin-bottom: 2rem;
      min-height: 1.5rem;
    }
    .slider-container {
      position: relative;
      width: 600px;
      max-width: 90vw;
      margin: 0 auto 2rem;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(to right, #1a1a1a, #333);
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      cursor: pointer;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
      transition: box-shadow 0.2s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
    }
    input[type="range"]::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      cursor: pointer;
      border: none;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    button {
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .play-btn {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff;
    }
    .play-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.4);
    }
    .play-btn.playing {
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }
    .markers {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      font-size: 0.75rem;
      color: #555;
    }
    .wave-selector {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }
    .wave-btn {
      padding: 0.4rem 1rem;
      border: 1px solid #333;
      border-radius: 999px;
      background: transparent;
      color: #888;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .wave-btn:hover {
      border-color: #f59e0b;
      color: #f59e0b;
    }
    .wave-btn.active {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      border-color: transparent;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bass Slider</h1>
    <p class="subtitle">slide to feel the low end</p>

    <div class="frequency-display">
      <span id="freqDisplay">50</span>
      <span class="frequency-unit">Hz</span>
    </div>
    <div class="note-label" id="noteLabel">G&vellip;</div>

    <div class="slider-container">
      <input
        type="range"
        id="freqSlider"
        min="20"
        max="400"
        value="50"
        step="1"
      />
      <div class="markers">
        <span>20 Hz</span>
        <span>100</span>
        <span>200</span>
        <span>300</span>
        <span>400 Hz</span>
      </div>
    </div>

    <div class="wave-selector" id="waveSelector">
      <button class="wave-btn active" data-wave="sine">Sine</button>
      <button class="wave-btn" data-wave="square">Square</button>
      <button class="wave-btn" data-wave="sawtooth">Saw</button>
      <button class="wave-btn" data-wave="triangle">Triangle</button>
    </div>

    <div class="controls">
      <button class="play-btn" id="playBtn">&#9654; Play</button>
    </div>
  </div>

  <script>
    let ctx = null;
    let oscillator = null;
    let gainNode = null;
    let isPlaying = false;

    const slider = document.getElementById('freqSlider');
    const freqDisplay = document.getElementById('freqDisplay');
    const noteLabel = document.getElementById('noteLabel');
    const playBtn = document.getElementById('playBtn');
    const waveBtns = document.querySelectorAll('.wave-btn');

    const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

    function getCtx() {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      return ctx;
    }

    function freqToNote(freq) {
      if (freq <= 0) return '';
      const A4 = 440;
      const semitones = 12 * Math.log2(freq / A4);
      const rounded = Math.round(semitones);
      const octave = Math.floor((rounded + 69) / 12) - 1;
      const noteIdx = ((rounded % 12) + 12) % 12;
      return notes[noteIdx] + octave;
    }

    function updateDisplay() {
      const freq = parseFloat(slider.value);
      freqDisplay.textContent = freq;
      noteLabel.textContent = freqToNote(freq);
      if (isPlaying && oscillator) {
        oscillator.frequency.setValueAtTime(freq, getCtx().currentTime);
      }
    }

    function startSound() {
      const c = getCtx();
      if (c.state === 'suspended') c.resume();
      oscillator = c.createOscillator();
      gainNode = c.createGain();
      oscillator.type = document.querySelector('.wave-btn.active').dataset.wave;
      oscillator.frequency.setValueAtTime(parseFloat(slider.value), c.currentTime);
      gainNode.gain.setValueAtTime(0.5, c.currentTime);
      oscillator.connect(gainNode);
      gainNode.connect(c.destination);
      oscillator.start();
      isPlaying = true;
      playBtn.textContent = '\u25A0 Stop';
      playBtn.classList.add('playing');
    }

    function stopSound() {
      if (oscillator) {
        try { oscillator.stop(); } catch (_) {}
        oscillator.disconnect();
        oscillator = null;
      }
      if (gainNode) {
        gainNode.disconnect();
        gainNode = null;
      }
      isPlaying = false;
      playBtn.textContent = '\u25B6 Play';
      playBtn.classList.remove('playing');
    }

    function togglePlay() {
      if (!isPlaying) startSound();
      else stopSound();
    }

    playBtn.addEventListener('click', togglePlay);
    playBtn.addEventListener('touchend', (e) => { e.preventDefault(); togglePlay(); });

    slider.addEventListener('input', updateDisplay);

    waveBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        waveBtns.forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        if (isPlaying && oscillator) {
          oscillator.type = btn.dataset.wave;
        }
      });
    });

    updateDisplay();
  </script>
</body>
</html>
